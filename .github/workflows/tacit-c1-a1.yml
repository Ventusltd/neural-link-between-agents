name: TACIT C1 independent A1 property and impact review
on:
  pull_request:
    paths:
      - automation/tacit_c1_a1.py
      - .github/workflows/tacit-c1-a1.yml
permissions:
  contents: read
  actions: read
jobs:
  a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ventusltd/vedic-
          ref: 7391b50343b7d7beecb8a32ccd748bfc00c2190b
          path: _peer_a1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned evidence acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/c1-a1"
          mkdir -p "$RUNNER_TEMP/evidence"
          python _peer_a1/tools/tacit_a1_properties.py acquire --root "$p"
          gh api repos/Ventusltd/vedic-/actions/artifacts/15143370771/zip > "$p/producer.zip"
      - name: Producer repeat and independent oracle offline
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/c1-a1"
          offline() { sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env -i PATH="$PATH" HOME="$HOME" "$@"; }
          for n in first second; do offline python _peer_a1/tools/tacit_a1_properties.py verify --root "$p" --out "$p/$n.json"; done
          offline python automation/tacit_c1_a1.py "$p" "$PWD/_peer_a1" "$RUNNER_TEMP/evidence/a1-review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tacit-c1-a1-independent
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
