name: TACIT C independent verification
on:
  pull_request:
    paths:
      - 'automation/tacit_c_verify.py'
      - '.github/workflows/tacit-c-verification.yml'
      - 'SESSIONS/2026-11-26-TACIT-C-FOURTH-TURN.md'
permissions:
  contents: read
  actions: read
jobs:
  channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire exact existing producer contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/channels" "$RUNNER_TEMP/evidence"
          python - <<'PY'
          import sys, pathlib, urllib.request
          sys.path.insert(0,"automation")
          from tacit_c_verify import PINS,blob
          import os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"channels"
          for name,(repo,commit,path,digest) in PINS.items():
              with urllib.request.urlopen(f"https://raw.githubusercontent.com/{repo}/{commit}/{path}",timeout=30) as f:
                  raw=f.read(8*1024*1024+1)
              if len(raw)>8*1024*1024 or blob(raw)!=digest: raise ValueError(name+" pin mismatch")
              (root/name).write_bytes(raw)
          PY
      - name: Offline graph and recovery controls
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env -i PATH="$PATH" HOME="$HOME" python automation/tacit_c_verify.py channels "$RUNNER_TEMP/channels" "$RUNNER_TEMP/evidence/channels.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacit-c-channel-observations
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
  orient:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Acquire exact internal build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/tacit-c"
          mkdir -p "$p/peer/tools" "$p/peer/packages/factory/admissions" "$p/peer/packages/factory/pending" "$p/oracle" "$p/inputs" "$RUNNER_TEMP/evidence"
          get() { curl -fsSL --max-time 60 --max-filesize 2097152 "https://raw.githubusercontent.com/$1/$2/$3" -o "$4"; }
          v=Ventusltd/vedic-
          f=2ccc717933f97e7d191dae85360559a12de7ed21
          for file in tools/package_factory.py tools/typed_package_execution.py packages/factory/admissions/orient.json packages/factory/orient-execution.json packages/factory/pending/electrical.json; do
            get "$v" "$f" "$file" "$p/peer/$file"
          done
          get "$v" 1aa2b9d1ab3bf9c6963b68b20ea608e826162e15 tools/tacit9/acceptance.py "$p/oracle/acceptance.py"
          get "$v" 2adc1fa9c52f1d242e601b1580927996e7cb31da tools/package_builder.py "$p/inputs/prototype.py"
          get Ventusltd/ventus-grid-engine 487ec7bd38dfa5aecb1c75da53b4a866ab2101cb LICENSE "$p/inputs/LICENSE"
          gh api repos/Ventusltd/vedic-/actions/artifacts/15126683549/zip > "$p/source.zip"
          echo "c4b7a4d582b56af8380ae33ab0c64782ec33b1e05c99d88af83a3b494eb4ead5  $p/source.zip" | sha256sum -c -
          gh api repos/Ventusltd/vedic-/actions/artifacts/15126783600/zip > "$p/peer.zip"
          echo "0e2add04245fce64c55d906be0387cca87b2c77eec55c14312ee6d7074ef2172  $p/peer.zip" | sha256sum -c -
          python - "$p" <<'PY'
          import pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1])
          for archive, entries in [("source.zip",[("source-receipt/receipt.json","receipt.json"),("source-receipt/v9-geodesy.mjs","module.mjs")]),("peer.zip",[("orient.json","peer-orient.json")])]:
              with zipfile.ZipFile(p/archive) as z:
                  for src,dest in entries:
                      if z.namelist().count(src)!=1 or z.getinfo(src).file_size>2097152: raise ValueError("ZIP member mismatch")
                      (p/"inputs"/dest).write_bytes(z.read(src))
          PY
      - name: Offline actual package and consumer falsification
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env -i PATH="$PATH" HOME="$HOME" python automation/tacit_c_verify.py runtime "$RUNNER_TEMP/tacit-c" "$RUNNER_TEMP/evidence/orient.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tacit-c-orient-observations
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
