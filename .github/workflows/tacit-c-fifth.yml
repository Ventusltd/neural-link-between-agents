name: TACIT C fifth-turn independent witnesses
on:
  pull_request:
    paths:
      - 'automation/tacit_c_fifth.py'
      - '.github/workflows/tacit-c-fifth.yml'
permissions:
  contents: read
  actions: read
jobs:
  witnesses:
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime, identities]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
      - name: Acquire immutable source and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/tacit-c-fifth"
          mkdir -p "$p" "$RUNNER_TEMP/evidence"
          get() { curl -fsSL --max-time 60 --max-filesize 10000000 "https://raw.githubusercontent.com/$1/$2/$3" -o "$4"; }
          v=Ventusltd/vedic-
          g=Ventusltd/ventus-grid-engine
          n=Ventusltd/neural-link-between-agents
          s=487ec7bd38dfa5aecb1c75da53b4a866ab2101cb
          for file in v9-geodesy.js v9-nearest-search.js voltage-drop.js; do
            get "$g" "$s" "engine/$file" "$p/$file"
          done
          if [ "$MODE" = runtime ]; then
            get "$v" 1aa2b9d1ab3bf9c6963b68b20ea608e826162e15 tools/tacit9/acceptance.py "$p/acceptance.py"
            test "$(git hash-object "$p/acceptance.py")" = "5101334d63b48d473e2123c13022d77fe32994a2"
            gh api "repos/$n/actions/artifacts/15137349637/zip" > "$p/previous.zip"
          else
            get Ventusltd/star-maker f65c2f381d91eeb1eba75a97ae6765c24e32197d elements/table.json "$p/table.json"
            get Ventusltd/stars 1cf9c7530c7d287ccf9b3cffd70f693fb83c8402 modular-star/blocks-catalogue.json "$p/catalogue.json"
            for pair in A:15137841195 crosswalk:15138207819 classification:15138926095; do
              gh api "repos/$v/actions/artifacts/${pair#*:}/zip" > "$p/${pair%:*}.zip"
            done
            gh api "repos/Ventusltd/stars/releases/assets/796582323" --header "Accept: application/octet-stream" > "$p/modular.sqlite.gz"
            echo "2379a68bd54096b94efcb13fb557aa8eaad68c756b5b3fdf09a64a51da5414c1  $p/modular.sqlite.gz" | sha256sum -c -
            python - "$p" <<'PY'
          import gzip, pathlib,sys
          p=pathlib.Path(sys.argv[1]);size=0
          with gzip.open(p/"modular.sqlite.gz","rb") as src,(p/"modular.sqlite").open("xb") as dst:
              while b:=src.read(1048576):
                  size+=len(b)
                  if size>4*1024**3:raise ValueError("database bound")
                  dst.write(b)
          PY
          fi
      - name: Independent offline producer witness
        env:
          MODE: ${{ matrix.mode }}
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env -i PATH="$PATH" HOME="$HOME" python automation/tacit_c_fifth.py "$MODE" "$RUNNER_TEMP/tacit-c-fifth" "$RUNNER_TEMP/evidence/fifth-$MODE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tacit-c-fifth-${{ matrix.mode }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
