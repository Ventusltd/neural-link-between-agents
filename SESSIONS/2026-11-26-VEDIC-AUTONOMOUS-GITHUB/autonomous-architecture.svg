<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">VEDIC autonomous GitHub architecture</title><desc id="desc">Daily source discovery passes through semantic duplicate checks and policy validation, then a protected pull request, independent CI and publication. Ambiguous items are held.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7698b6"/></marker></defs><rect width="1200" height="1020" rx="22" fill="#091726"/><text x="42" y="57" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9" text-anchor="start">VEDIC / AUTONOMOUS INTELLIGENCE</text><text x="42" y="91" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#7dd3fc" text-anchor="start">GitHub-hosted only  •  03:37 UTC  •  no local computing dependency</text>
<rect x="42" y="124" width="530" height="123" rx="15" fill="#11263b" stroke="#38bdf8" stroke-opacity=".8"/><circle cx="68" cy="152" r="14" fill="#38bdf8"/><text x="68" y="157" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">01</text><text x="91" y="158" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Permanent source inventory</text><text x="64" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Kuiper + Modular Star catalogue</text><text x="64" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Verify digest, pin source revision and family hash</text>
<rect x="628" y="124" width="530" height="123" rx="15" fill="#11263b" stroke="#38bdf8" stroke-opacity=".8"/><circle cx="654" cy="152" r="14" fill="#38bdf8"/><text x="654" y="157" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">02</text><text x="677" y="158" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Durable research ledger</text><text x="650" y="188" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Resume cursor; preserve pending work and decisions</text><text x="650" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Commit compact state independently of artifacts</text>
<path d="M572 185 L628 185" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><path d="M893 247 L893 278" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="628" y="278" width="530" height="123" rx="15" fill="#11263b" stroke="#38bdf8" stroke-opacity=".8"/><circle cx="654" cy="306" r="14" fill="#38bdf8"/><text x="654" y="311" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">03</text><text x="677" y="312" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Static capability extraction</text><text x="650" y="342" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">AST / signatures / docstrings / fixtures</text><text x="650" y="366" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Never execute untrusted source or instructions</text>
<rect x="42" y="278" width="530" height="123" rx="15" fill="#11263b" stroke="#38bdf8" stroke-opacity=".8"/><circle cx="68" cy="306" r="14" fill="#38bdf8"/><text x="68" y="311" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">04</text><text x="91" y="312" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Duplicate &amp; meaning gates</text><text x="64" y="342" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Exact source identity + canonical labels + aliases</text><text x="64" y="366" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Contract fingerprint + ranked similarity review</text>
<path d="M628 339 L572 339" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><path d="M307 401 L307 432" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="42" y="432" width="530" height="147" rx="15" fill="#11263b" stroke="#fbbf24" stroke-opacity=".8"/><circle cx="68" cy="460" r="14" fill="#fbbf24"/><text x="68" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">05</text><text x="91" y="466" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Deterministic admission policy</text><text x="64" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">High-evidence static commands only</text><text x="64" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Uncertain matches go to durable HOLD queue</text><text x="64" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Up to 20 new IDs; no gaps or forced renaming</text>
<rect x="628" y="432" width="530" height="147" rx="15" fill="#11263b" stroke="#a78bfa" stroke-opacity=".8"/><circle cx="654" cy="460" r="14" fill="#a78bfa"/><text x="654" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">06</text><text x="677" y="466" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Protected admission pull request</text><text x="650" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Dictionary + admitted evidence + pending queue</text><text x="650" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Compare exact base SHA; one active proposal</text><text x="650" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Independent CI; auto-merge only under rules</text>
<path d="M572 505 L628 505" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><path d="M893 579 L893 610" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="628" y="610" width="530" height="123" rx="15" fill="#11263b" stroke="#34d399" stroke-opacity=".8"/><circle cx="654" cy="638" r="14" fill="#34d399"/><text x="654" y="643" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">07</text><text x="677" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Independent release checks</text><text x="650" y="674" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Reconstruct history; verify source evidence</text><text x="650" y="698" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Chromium / WebKit; deploy and verify served data</text>
<rect x="42" y="610" width="530" height="123" rx="15" fill="#11263b" stroke="#34d399" stroke-opacity=".8"/><circle cx="68" cy="638" r="14" fill="#34d399"/><text x="68" y="643" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#071522" text-anchor="middle">08</text><text x="91" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1f5f9" text-anchor="start">Public VEDIC dictionary</text><text x="64" y="674" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Fast searchable command index; 100 rows/page</text><text x="64" y="698" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#b6c8dc" text-anchor="start">Static evidence distinct from executable proof</text>
<path d="M628 671 L572 671" stroke="#7698b6" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="42" y="780" width="1116" height="192" rx="18" fill="#0e2133" stroke="#294c68"/><text x="64" y="813" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7dd3fc" text-anchor="start">OPERATING LIMITS / STARTING CONFIGURATION</text>
<text x="180" y="876" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9" text-anchor="middle">1</text><text x="180" y="909" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#b6c8dc" text-anchor="middle">run / day</text><text x="460" y="876" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9" text-anchor="middle">100</text><text x="460" y="909" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#b6c8dc" text-anchor="middle">families / run</text><text x="740" y="876" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9" text-anchor="middle">20</text><text x="740" y="909" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#b6c8dc" text-anchor="middle">admissions / run</text><text x="1020" y="876" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9" text-anchor="middle">0</text><text x="1020" y="909" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#b6c8dc" text-anchor="middle">unverified executions</text><text x="64" y="950" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b6c8dc" text-anchor="start">No quota-driven admissions. Zero valid candidates is a successful, auditable outcome.</text></svg>