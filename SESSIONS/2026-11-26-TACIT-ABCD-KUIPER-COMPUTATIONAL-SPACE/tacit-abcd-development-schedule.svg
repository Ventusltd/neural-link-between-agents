<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Joint development turns 8–10</title><desc id="d">Four agent workstreams and three relative ten-minute development cycles. Proposed work, not completed progress.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091521"/><stop offset="1" stop-color="#060b12"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52b5c4"/></marker></defs><rect width="1200" height="690" rx="20" fill="url(#bg)"/><text x="42" y="52" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="750" fill="#f1f7ff" text-anchor="start">TACIT A–D / THREE-TURN DEVELOPMENT PLAN</text><text x="42" y="82" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#9db7c6" text-anchor="start">12 scoped work packages · 8 min development + 2 min finalisation per turn</text><text x="272" y="127" font-family="system-ui,Segoe UI,sans-serif" font-size="19" font-weight="750" fill="#79d5ce" text-anchor="start">TURN 8</text><text x="272" y="151" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#c0d2de" text-anchor="start">Trusted inputs and gates</text><text x="572" y="127" font-family="system-ui,Segoe UI,sans-serif" font-size="19" font-weight="750" fill="#79d5ce" text-anchor="start">TURN 9</text><text x="572" y="151" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#c0d2de" text-anchor="start">Execution and patterns</text><text x="872" y="127" font-family="system-ui,Segoe UI,sans-serif" font-size="19" font-weight="750" fill="#79d5ce" text-anchor="start">TURN 10</text><text x="872" y="151" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#c0d2de" text-anchor="start">Recovery and protection</text><rect x="42"