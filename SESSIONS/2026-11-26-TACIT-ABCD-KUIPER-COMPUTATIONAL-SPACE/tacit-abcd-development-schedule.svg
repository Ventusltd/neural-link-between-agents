" font-size="13" font-weight="400" fill="#79c5ba" text-anchor="start">Deliver exact evidence</text><rect x="864" y="487" width="284" height="88" rx="12" fill="#122232" stroke="#39576b"/><text x="880" y="526" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="start">Integrated research layer</text><text x="880" y="551" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#79c5ba" text-anchor="start">Deliver exact evidence</text><path d="M48 614H1152" stroke="#355665"/><text x="42" y="643" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="400" fill="#c5d7df" text-anchor="start">Shared gates: no invented IDs · no rights bypass · no admission by test count · no publication without authority</text><text x="42" y="667" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#9eb6c4" text-anchor="start">Relative schedule; CI duration and independent approvals may extend beyond a turn.</text></svg>