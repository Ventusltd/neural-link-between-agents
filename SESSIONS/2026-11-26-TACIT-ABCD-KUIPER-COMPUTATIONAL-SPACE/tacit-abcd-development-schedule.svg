ecution</text><rect x="264" y="279" width="284" height="88" rx="12" fill="#122232" stroke="#39576b"/><text x="280" y="318" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="start">Admission mechanism</text><text x="280" y="343" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#79c5ba" text-anchor="start">Deliver exact evidence</text><rect x="564" y="279" width="284" height="88" rx="12" fill="#122232" stroke="#39576b"/><text x="580" y="318" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="start">Actual runtime / archive</text><text x="580" y="343" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#79c5ba" text-anchor="start">Deliver exact evidence</text><rect x="864" y="279" width="284" height="88" rx="12" fill="#122232" stroke="#39576b"/><text x="880" y="318" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="start">Reusable consumer</text><text x="880" y="343" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#79c5ba" text-anchor="start">Deliver exact evidence</text><rect x="42" y="383" width="206" height="88" rx="12" fill="#102333" stroke="#36576b"/><text x="60" y="416" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="750" fill="#eefaff" text-anchor="start">TACIT C</text><text x="60" y="442" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#b4c9d5" text-anchor="start">Independent verification</text><rect x="264" y="383" width="284" height="88" rx="12" fill="#122232" stroke="#39576b"/><text x="280" y="422" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#edf5fa" text-anchor="start">Gate falsification</text><text x="280" y="447" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#79c5