<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Public learning walk concept</title><desc id="d">Abstract sequence of user-selected public waypoints, with educational subjects independent of the walking route.</desc><rect width="800" height="430" rx="12" fill="#080e16"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#00ffff" font-size="23" font-weight="bold">LEARN THE GRID — ONE PUBLIC POINT AT A TIME</text><text x="28" y="66" fill="#aab6c8" font-size="15">Conceptual sequence; not an actual route or an infrastructure access plan.</text><path d="M110 135H690" stroke="#92acb8" stroke-width="3" stroke-dasharray="10 8"/>
<circle cx="110" cy="135" r="24" fill="#122935" stroke="#00ffff" stroke-width="2"/><text x="110" y="143" text-anchor="middle" fill="#00ffff" font-size="21" font-weight="bold">1</text><text x="110" y="181" text-anchor="middle" fill="#e5edf5" font-size="15">Public start</text><circle cx="303" cy="135" r="24" fill="#122935" stroke="#00ffff" stroke-width="2"/><text x="303" y="143" text-anchor="middle" fill="#00ffff" font-size="21" font-weight="bold">2</text><text x="303" y="181" text-anchor="middle" fill="#e5edf5" font-size="15">Public viewpoint</text><circle cx="497" cy="135" r="24" fill="#122935" stroke="#00ffff" stroke-width="2"/><text x="497" y="143" text-anchor="middle" fill="#00ffff" font-size="21" font-weight="bold">3</text><text x="497" y="181" text-anchor="middle" fill="#e5edf5" font-size="15">Public waypoint</text><circle cx="690" cy="135" r="24" fill="#122935" stroke="#00ffff" stroke-width="2"/><text x="690" y="143" text-anchor="middle" fill="#00ffff" font-size="21" font-weight="bold">4</text><text x="690" y="181" text-anchor="middle" fill="#e5edf5" font-size="15">Public finish</text>
<text x="400" y="226" text-anchor="middle" fill="#aab6c8" font-size="16">Choose each point explicitly · Compass orientation or Google walking directions</text>
<rect x="28" y="255" width="240" height="82" rx="7" fill="#101d29" stroke="#367078"/><text x="148" y="287" text-anchor="middle" font-size="19" fill="#00ffff">Generation</text><text x="148" y="313" text-anchor="middle" font-size="14" fill="#e5edf5">Where power begins</text><rect x="280" y="255" width="240" height="82" rx="7" fill="#101d29" stroke="#367078"/><text x="400" y="287" text-anchor="middle" font-size="19" fill="#00ffff">Transmission</text><text x="400" y="313" text-anchor="middle" font-size="14" fill="#e5edf5">Why high voltages matter</text><rect x="532" y="255" width="240" height="82" rx="7" fill="#101d29" stroke="#367078"/><text x="652" y="287" text-anchor="middle" font-size="19" fill="#00ffff">Demand &amp; storage</text><text x="652" y="313" text-anchor="middle" font-size="14" fill="#e5edf5">How the system balances</text>
<text x="28" y="369" fill="#ffd500" font-size="15">Learning topics are independent of walking paths and do not imply permission to approach assets.</text><text x="28" y="397" fill="#aab6c8" font-size="14">Stay on permitted paths. View public geography; refer restricted detail to official services.</text></g></svg>